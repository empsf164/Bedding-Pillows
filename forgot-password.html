<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NESTORA Bedding</title>
  <meta name="description"
    content="Reset your NESTORA account password quickly and securely.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231C1A18'/><path d='M30 68V32h9l18 24V32h9v36h-9L39 44v24z' fill='%23FDFBF7'/><circle cx='74' cy='66' r='4' fill='%235E6D5B'/></svg>">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Nestora Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body style="background-color: var(--bg-main, #FDFBF7); min-height: 100vh;" class="d-flex align-items-center justify-content-center py-5">

  <!-- Auth Box Container -->
  <main class="w-100 px-3">
    <div class="mx-auto" style="max-width: 460px;">
      <div class="card border rounded-4 p-4 p-md-5 bg-surface shadow-md">
        
        <!-- Brand Name in Top Center -->
        <div class="text-center mb-4">
          <div class="mb-3">
            <a href="index.html" class="brand-logo fs-2 d-inline-block">
              NESTORA<span class="brand-dot"></span>
            </a>
          </div>
          <!-- Welcome message in separate line -->
          <div class="eyebrow mb-2">Account Recovery</div>
          <h1 class="h3 font-display mb-2">Reset Your Password</h1>
          <p class="text-muted small mb-0">Enter your email address to receive reset instructions.</p>
        </div>

        <div id="forgot-success-alert" class="alert alert-success small d-none mb-4" role="alert">
          <i class="bi bi-check-circle-fill me-1"></i> A password reset link has been dispatched to your email address.
        </div>

        <form id="nestora-forgot-form">
          <!-- Email on separate line -->
          <div class="mb-4">
            <label for="forgot-email" class="form-label-nestora">Email Address</label>
            <input type="email" id="forgot-email" class="form-control-nestora" required placeholder="you@example.com">
          </div>

          <button type="submit" class="btn-nestora btn-nestora-primary w-100 mb-3">Send Reset Instructions</button>

          <div class="text-center small text-muted mb-4">
            Remembered your credentials? <a href="login.html" class="fw-semibold text-dark text-decoration-underline">Back to Sign In</a>
          </div>

          <!-- Social Login with Flex Divider (no overlapping lines) -->
          <div class="d-flex align-items-center my-4">
            <div class="flex-grow-1 border-top border-secondary-subtle"></div>
            <span class="px-3 text-muted small text-nowrap">Or sign in with</span>
            <div class="flex-grow-1 border-top border-secondary-subtle"></div>
          </div>

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary w-100 py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2"
              onclick="NestoraAuth.login('google.user@nestora.com', 'Google Member'); setTimeout(()=>window.location.href='account.html',500);">
              <i class="bi bi-google"></i> Google
            </button>
            <button type="button" class="btn btn-outline-secondary w-100 py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2"
              onclick="NestoraAuth.login('apple.user@nestora.com', 'Apple Member'); setTimeout(()=>window.location.href='account.html',500);">
              <i class="bi bi-apple"></i> Apple
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
