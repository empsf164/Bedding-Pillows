<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NESTORA Bedding</title>
  <meta name="description" content="Reset your NESTORA account password quickly and securely.">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Nestora Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-secondary bg-opacity-25">

  <!-- Header Minimal -->
  <header class="py-3 bg-surface border-bottom">
    <div class="nestora-container d-flex align-items-center justify-content-between">
      <a href="index.html" class="brand-logo fs-3">NESTORA<span class="brand-dot"></span></a>
      <a href="login.html" class="btn-nestora btn-nestora-ghost btn-nestora-sm">Back to Sign In</a>
    </div>
  </header>

  <!-- Forgot Password Form Container -->
  <main class="section-spacing d-flex align-items-center justify-content-center">
    <div class="nestora-container" style="max-width: 480px;">
      <div class="card border rounded-3 p-4 p-md-5 bg-surface shadow-md">
        <div class="text-center mb-4">
          <span class="eyebrow">Account Recovery</span>
          <h1 class="h2 font-display mb-1">Reset Your Password</h1>
          <p class="text-muted small">Enter your email address and we'll send you instructions to reset your password.</p>
        </div>

        <div id="forgot-success-alert" class="alert alert-success small d-none mb-4" role="alert">
          <i class="bi bi-check-circle-fill me-1"></i> A password reset link has been dispatched to your email address.
        </div>

        <form id="nestora-forgot-form">
          <div class="mb-4">
            <label for="forgot-email" class="form-label-nestora">Email Address</label>
            <input type="email" id="forgot-email" class="form-control-nestora" required placeholder="you@example.com">
          </div>

          <button type="submit" class="btn-nestora btn-nestora-primary w-100 mb-3">Send Reset Instructions</button>

          <div class="text-center small text-muted">
            Remembered your credentials? <a href="login.html" class="fw-semibold text-dark text-decoration-underline">Back to Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer Minimal -->
  <footer class="py-4 text-center small text-muted border-top bg-surface">
    <div class="nestora-container">
      © <span class="current-year"></span> NESTORA Home LLC. All rights reserved.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
