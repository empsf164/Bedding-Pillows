<!DOCTYPE html>

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<body style="background-color: var(--color-bg-primary, #FDFBF7);">

  <!-- Header Minimal -->

    <div class="nestora-container d-flex align-items-center justify-content-between">

      <div class="d-flex align-items-center gap-3">
        <a href="shop.html" class="btn-nestora btn-nestora-secondary btn-nestora-sm">Continue Shopping</a>

    </div>

      <div id="order-confirmation-details">

    <div class="nestora-container">
      <div class="footer-social-links justify-content-center mb-3">
