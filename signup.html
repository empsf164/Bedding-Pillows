<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — NESTORA Bedding</title>
  <meta name="description"
    content="Create your NESTORA account to unlock seamless checkout, order tracking, and private collection launches.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231C1A18'/><path d='M30 68V32h9l18 24V32h9v36h-9L39 44v24z' fill='%23FDFBF7'/><circle cx='74' cy='66' r='4' fill='%235E6D5B'/></svg>">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Nestora Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body style="background-color: var(--bg-main, #FDFBF7); min-height: 100vh;" class="d-flex align-items-center justify-content-center py-5">

  <!-- Auth Box Container -->
  <main class="w-100 px-3">
    <div class="mx-auto" style="max-width: 480px;">
      <div class="card border rounded-4 p-4 p-md-5 bg-surface shadow-md">
        
        <!-- Brand Name in Top Center -->
        <div class="text-center mb-4">
          <div class="mb-3">
            <a href="index.html" class="brand-logo fs-2 d-inline-block">
              NESTORA<span class="brand-dot"></span>
            </a>
          </div>
          <!-- Welcome message in separate line -->
          <div class="eyebrow mb-2">Join NESTORA</div>
          <h1 class="h3 font-display mb-2">Create Your Account</h1>
          <p class="text-muted small mb-0">Unlock private fabric drops and 100-night trial perks.</p>
        </div>

        <form id="nestora-signup-form">
          <!-- Full Name on separate line -->
          <div class="mb-3">
            <label for="signup-name" class="form-label-nestora">Full Name *</label>
            <input type="text" id="signup-name" class="form-control-nestora" required placeholder="Eleanor Vance">
          </div>

          <!-- Email Address on separate line -->
          <div class="mb-3">
            <label for="signup-email" class="form-label-nestora">Email Address *</label>
            <input type="email" id="signup-email" class="form-control-nestora" required placeholder="you@example.com">
          </div>

          <!-- Password on separate line -->
          <div class="mb-3">
            <label for="signup-password" class="form-label-nestora">Password *</label>
            <input type="password" id="signup-password" class="form-control-nestora" required placeholder="At least 8 characters">
          </div>

          <!-- Confirm Password on separate line -->
          <div class="mb-3">
            <label for="signup-confirm-password" class="form-label-nestora">Confirm Password *</label>
            <input type="password" id="signup-confirm-password" class="form-control-nestora" required placeholder="Repeat password">
          </div>

          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="signup-newsletter" checked>
            <label class="form-check-label small text-muted" for="signup-newsletter">
              Subscribe to NESTORA Sleep Journal & receive $20 off first order
            </label>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="signup-terms" required checked>
            <label class="form-check-label small text-muted" for="signup-terms">
              I agree to the <a href="about.html" class="text-decoration-underline text-dark">Terms</a> & <a href="about.html" class="text-decoration-underline text-dark">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn-nestora btn-nestora-primary w-100 mb-3">Create Account</button>

          <div class="text-center small text-muted mb-4">
            Already have an account? <a href="login.html" class="fw-semibold text-dark text-decoration-underline">Sign In</a>
          </div>

          <!-- Social Sign Up with Flex Divider (no overlapping lines) -->
          <div class="d-flex align-items-center my-4">
            <div class="flex-grow-1 border-top border-secondary-subtle"></div>
            <span class="px-3 text-muted small text-nowrap">Or sign up with</span>
            <div class="flex-grow-1 border-top border-secondary-subtle"></div>
          </div>

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary w-100 py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2"
              onclick="NestoraAuth.login('google.user@nestora.com', 'Google Member'); setTimeout(()=>window.location.href='account.html',500);">
              <i class="bi bi-google"></i> Google
            </button>
            <button type="button" class="btn btn-outline-secondary w-100 py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2"
              onclick="NestoraAuth.login('apple.user@nestora.com', 'Apple Member'); setTimeout(()=>window.location.href='account.html',500);">
              <i class="bi bi-apple"></i> Apple
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
