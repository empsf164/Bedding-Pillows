<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account — NESTORA Bedding</title>
  <meta name="description" content="Create your NESTORA account to unlock seamless checkout, order tracking, and private collection launches.">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Nestora Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="bg-secondary bg-opacity-25">

  <!-- Header Minimal -->
  <header class="py-3 bg-surface border-bottom">
    <div class="nestora-container d-flex align-items-center justify-content-between">
      <a href="index.html" class="brand-logo fs-3">NESTORA<span class="brand-dot"></span></a>
      <a href="login.html" class="btn-nestora btn-nestora-ghost btn-nestora-sm">Already a member? Sign In</a>
    </div>
  </header>

  <!-- Signup Form Container -->
  <main class="section-spacing d-flex align-items-center justify-content-center">
    <div class="nestora-container" style="max-width: 520px;">
      <div class="card border rounded-3 p-4 p-md-5 bg-surface shadow-md">
        <div class="text-center mb-4">
          <span class="eyebrow">Join NESTORA</span>
          <h1 class="h2 font-display mb-1">Create Your Account</h1>
          <p class="text-muted small">Unlock private fabric drops, 100-night trial perks, and seamless order tracking.</p>
        </div>

        <form id="nestora-signup-form">
          <div class="mb-3">
            <label for="signup-name" class="form-label-nestora">Full Name *</label>
            <input type="text" id="signup-name" class="form-control-nestora" required placeholder="Eleanor Vance">
          </div>

          <div class="mb-3">
            <label for="signup-email" class="form-label-nestora">Email Address *</label>
            <input type="email" id="signup-email" class="form-control-nestora" required placeholder="you@example.com">
          </div>

          <div class="row g-2 mb-3">
            <div class="col-sm-6">
              <label for="signup-password" class="form-label-nestora">Password *</label>
              <input type="password" id="signup-password" class="form-control-nestora" required placeholder="At least 8 characters">
            </div>
            <div class="col-sm-6">
              <label for="signup-confirm-password" class="form-label-nestora">Confirm Password *</label>
              <input type="password" id="signup-confirm-password" class="form-control-nestora" required placeholder="Repeat password">
            </div>
          </div>

          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="signup-newsletter" checked>
            <label class="form-check-label small text-muted" for="signup-newsletter">
              Subscribe to the NESTORA Sleep Journal & receive $20 off first order
            </label>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="signup-terms" required checked>
            <label class="form-check-label small text-muted" for="signup-terms">
              I agree to the <a href="about.html" class="text-decoration-underline text-dark">Terms of Service</a> & <a href="about.html" class="text-decoration-underline text-dark">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn-nestora btn-nestora-primary w-100 mb-3">Create Account</button>

          <div class="text-center small text-muted">
            Already have an account? <a href="login.html" class="fw-semibold text-dark text-decoration-underline">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer Minimal -->
  <footer class="py-4 text-center small text-muted border-top bg-surface">
    <div class="nestora-container">
      © <span class="current-year"></span> NESTORA Home LLC. All rights reserved.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
