<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Sign In — NESTORA Bedding</title>
  <meta name="description"
    content="Sign in to your NESTORA sleep account to view past orders, track deliveries, and manage saved bedding items.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231C1A18'/><path d='M30 68V32h9l18 24V32h9v36h-9L39 44v24z' fill='%23FDFBF7'/><circle cx='74' cy='66' r='4' fill='%235E6D5B'/></svg>">

  <!-- Bootstrap 5 CSS & Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Nestora Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>

<body style="background-color: var(--bg-main, #FDFBF7); min-height: 100vh;" class="d-flex align-items-center justify-content-center py-5">

  <!-- Auth Box Container -->
  <main class="w-100 px-3">
    <div class="mx-auto" style="max-width: 460px;">
      <div class="card border rounded-4 p-4 p-md-5 bg-surface shadow-md">
        
        <!-- Brand Name in Top Center -->
        <div class="text-center mb-4">
          <div class="mb-3">
            <a href="index.html" class="brand-logo fs-2 d-inline-block">
              NESTORA<span class="brand-dot"></span>
            </a>
          </div>
          <!-- Welcome Message in separate line -->
          <div class="eyebrow mb-2">Welcome Back</div>
          <h1 class="h3 font-display mb-2">Sign In to Your Account</h1>
          <p class="text-muted small mb-0">Access your sleep orders and saved items.</p>
        </div>

        <form id="nestora-login-form">
          <!-- Email Address on separate line -->
          <div class="mb-3">
            <label for="login-email" class="form-label-nestora">Email Address</label>
            <input type="email" id="login-email" class="form-control-nestora" value="eleanor.vance@nestora-sleep.com"
              required placeholder="you@example.com">
          </div>

          <!-- Password on separate line -->
          <div class="mb-3">
            <label for="login-password" class="form-label-nestora">Password</label>
            <div class="password-input-group">
              <input type="password" id="login-password" class="form-control-nestora" value="••••••••••••" required
                placeholder="Enter password">
              <button type="button" class="btn-password-toggle" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Remember Me and Forgot Password on the same line -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="remember-me" checked>
              <label class="form-check-label small text-muted" for="remember-me">
                Remember me
              </label>
            </div>
            <a href="forgot-password.html" class="small auth-link">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-nestora btn-nestora-primary w-100 mb-3">Sign In</button>

          <div class="text-center small text-muted mb-4">
            Don't have an account? <a href="signup.html" class="auth-link">Create Account</a>
          </div>

          <!-- Social Login with Flex Divider (no overlapping lines) -->
          <div class="d-flex align-items-center my-4">
            <div class="flex-grow-1 border-top border-secondary-subtle"></div>
            <span class="px-3 text-muted small text-nowrap">Or continue with</span>
            <div class="flex-grow-1 border-top border-secondary-subtle"></div>
          </div>

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary w-100 py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2"
              onclick="NestoraAuth.login('google.user@nestora.com', 'Google Member'); setTimeout(()=>window.location.href='account.html',500);">
              <i class="bi bi-google"></i> Google
            </button>
            <button type="button" class="btn btn-outline-secondary w-100 py-2 small fw-semibold d-flex align-items-center justify-content-center gap-2"
              onclick="NestoraAuth.login('apple.user@nestora.com', 'Apple Member'); setTimeout(()=>window.location.href='account.html',500);">
              <i class="bi bi-apple"></i> Apple
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- Back to Top Button -->
  <button id="btn-back-to-top" class="btn-back-to-top" aria-label="Back to top" title="Back to top">
    <i class="bi bi-chevron-up"></i>
  </button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/main.js"></script>
</body>

</html>
